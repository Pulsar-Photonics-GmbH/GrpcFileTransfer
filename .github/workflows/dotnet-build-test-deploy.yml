name: BuildTest

on: [push, pull_request]

jobs:
  build_and_test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: ./src
    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 11.0.x
    
    - name: Dotnet clean
      run: dotnet clean
    
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    # Microsoft.Testing.Platform mode (test.runner in global.json) finds the solution in
    # the working directory and writes the results as a TRX report.
    - name: Test
      run: dotnet test --no-build --report-trx --results-directory TestResults

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results-${{ matrix.os }}
        # Relative to the workspace root, not the job's working-directory.
        path: src/TestResults/
        if-no-files-found: warn


  publish_nuget:
    needs: [build_and_test]
    if: startsWith(github.ref, 'refs/tags/v') # make sure deploy only runs on tags with version number
    runs-on: windows-latest
    # NuGet trusted publishing: the job's GitHub OIDC token is exchanged for a short-lived
    # nuget.org API key (policy on nuget.org: Pulsar-Photonics, this repo and workflow file).
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ./src
        
    steps:
    - uses: actions/checkout@v7
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 11.0.x
        
    - name: Dotnet clean
      run: dotnet clean
    
    - name: Restore dependencies
      run: dotnet restore
                          
    - name: Build 
      run: dotnet build --configuration Release
                        
    - name: Pack nuget
      run: |
        $env:RELEASE_VERSION=($env:GITHUB_REF).split("tags/v")[-1]
        echo $env:RELEASE_VERSION
        echo $env:GITHUB_SHA
        mkdir nupkg
        dotnet pack -p:PackageVersion=$env:RELEASE_VERSION -o  $PWD\nupkg -p:RepositoryCommit=$env:GITHUB_SHA --configuration Release -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg
    
    # The key is valid for one hour, so it is requested right before the push.
    - name: NuGet login (OIDC to temporary API key)
      uses: NuGet/login@v1
      id: nuget_login
      with:
        user: ax_meyer

    - name: Publish nuget
      run: |
        cd nupkg
        dotnet nuget push "**/*.nupkg" --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }} --source "https://api.nuget.org/v3/index.json" --skip-duplicate
